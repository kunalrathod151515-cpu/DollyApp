<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#f73819" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Letter P -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
  <!-- Fork & Knife accents -->
  <circle cx="160" cy="140" r="14" fill="#ffffff" opacity="0.8" />
  <circle cx="352" cy="140" r="14" fill="#ffffff" opacity="0.8" />
</svg>
